<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体能闯关游戏 - 一年级专属版</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background: linear-gradient(90deg, #ff6b6b, #ffcc00, #06d6a0, #4ecdc4, #118ab2);
        }
        
        /* 标题样式 */
        h1 {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 15px;
            font-size: 3em;
            text-shadow: 3px 3px 0 #ffd166;
            background: linear-gradient(45deg, #ff6b6b, #ff9e00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #118ab2;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        /* 登录表单样式 */
        .login-form {
            background: linear-gradient(135deg, #c7f9cc, #80ed99);
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 5px solid #38b000;
            box-shadow: 0 15px 30px rgba(56, 176, 0, 0.3);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            color: #073b4c;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 18px;
            border: 4px solid #06d6a0;
            border-radius: 15px;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff9e00;
            box-shadow: 0 0 15px rgba(255, 158, 0, 0.5);
        }
        
        /* 隐藏的表单元素 */
        .hidden-field {
            display: none;
        }
        
        /* 标准显示 */
        .standard-display {
            background: #ffef9f;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            border: 3px solid #ff9e00;
            font-size: 1.1em;
            display: none;
        }
        
        /* 按钮样式 */
        .btn {
            width: 100%;
            padding: 22px;
            font-size: 1.4em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #06d6a0, #0a9396);
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #118ab2, #073b4c);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ff9e00, #ee9b00);
            color: white;
        }
        
        /* 游戏主界面 */
        #game-area {
            display: none;
        }
        
        .game-status {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #118ab2, #073b4c);
            color: white;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(17, 138, 178, 0.4);
        }
        
        .status-box {
            text-align: center;
            flex: 1;
        }
        
        .status-value {
            font-size: 2.8em;
            font-weight: bold;
            color: #ffd166;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            margin-top: 5px;
        }
        
        /* 怪物区域 */
        .monster-area {
            background: linear-gradient(135deg, #ffd9e3, #ffb3c6);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            border: 5px solid #ff8fab;
            text-align: center;
            box-shadow: 0 15px 30px rgba(255, 143, 171, 0.3);
        }
        
        .monster-name {
            font-size: 2.5em;
            color: #ef476f;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 white;
        }
        
        .monster-img {
            font-size: 7em;
            margin: 25px 0;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-20px) rotate(5deg); }
            75% { transform: translateY(-10px) rotate(-5deg); }
        }
        
        /* 数据展示 */
        .data-display {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
            border: 3px dashed #06d6a0;
            font-size: 1.2em;
        }
        
        /* 星星评分 */
        .stars-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            gap: 15px;
        }
        
        .star {
            font-size: 4em;
            color: #ddd;
            transition: all 0.3s;
        }
        
        .star.active {
            color: #ffd700;
            transform: scale(1.2);
            animation: starGlow 1s ease infinite alternate;
        }
        
        @keyframes starGlow {
            from { filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2)); }
            to { filter: drop-shadow(0 0 20px #ffd700); }
        }
        
        .stars-count {
            font-size: 2em;
            font-weight: bold;
            color: #ff9e00;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 4px solid #ff9e00;
        }
        
        /* 结果区域 */
        .result-area {
            padding: 35px;
            border-radius: 25px;
            margin: 30px 0;
            text-align: center;
            font-size: 1.3em;
            border: 5px solid;
            display: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(6, 214, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0); }
        }
        
        .result-perfect {
            background: linear-gradient(135deg, #c7f9cc, #80ed99);
            border-color: #38b000;
        }
        
        .result-good {
            background: linear-gradient(135deg, #a0e7e5, #4ecdc4);
            border-color: #06d6a0;
        }
        
        .result-ok {
            background: linear-gradient(135deg, #ffd6a5, #ffc09f);
            border-color: #ff9e00;
        }
        
        .result-need-improve {
            background: linear-gradient(135deg, #ffccd5, #ff8fab);
            border-color: #ef476f;
        }
        
        .result-title {
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* 兑奖券 */
        .coupon-area {
            background: white;
            padding: 40px;
            border-radius: 25px;
            border: 12px double #ef476f;
            display: none;
            text-align: center;
            box-shadow: 0 20px 40px rgba(239, 71, 111, 0.3);
        }
        
        .coupon-title {
            color: #ef476f;
            font-size: 2.8em;
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        .coupon-code {
            font-family: 'Courier New', monospace;
            font-size: 2.5em;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ffef9f, #ffd166);
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            border: 5px dashed #ff9e00;
            font-weight: bold;
        }
        
        /* 动画 */
        .bounce {
            animation: bounce 0.6s;
        }
        
        @keyframes bounce {
            0%, 20%, 60%, 100% { transform: translateY(0); }
            40% { transform: translateY(-25px); }
            80% { transform: translateY(-15px); }
        }
        
        .celebrate {
            animation: celebrate 0.8s ease 3;
        }
        
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .game-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .monster-img {
                font-size: 5em;
            }
            
            .coupon-code {
                font-size: 1.8em;
                letter-spacing: 5px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏆 体能闯关游戏 - 一年级版 🏆</h1>
        <p class="subtitle">输入你的姓名，开始闯关吧！</p>
        
        <!-- 登录表单 -->
        <div id="login-form" class="login-form">
            <div class="form-group">
                <label>你的姓名</label>
                <input type="text" id="student-name" placeholder="请输入你的姓名" maxlength="10">
            </div>
            
            <!-- 隐藏的表单元素 -->
            <div class="form-group hidden-field">
                <label>你的性别</label>
                <div class="gender-selection">
                    <div class="gender-option">
                        <input type="radio" id="gender-boy" name="gender" value="boy">
                        <label for="gender-boy" class="gender-label">
                            👦 我是男生
                        </label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" id="gender-girl" name="gender" value="girl">
                        <label for="gender-girl" class="gender-label">
                            👧 我是女生
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="form-group hidden-field">
                <label>跳绳成绩（个）</label>
                <input type="number" id="student-rope" placeholder="例如：115" min="0" step="1">
            </div>
            
            <div class="form-group hidden-field">
                <label>坐位体前屈（厘米）</label>
                <input type="number" id="student-sit" placeholder="例如：19.5" min="-10" step="0.1">
            </div>
            
            <div class="form-group hidden-field">
                <label>50米跑成绩（秒）</label>
                <input type="number" id="student-run" placeholder="例如：10.5" min="0" step="0.1">
            </div>
            
            <!-- 标准显示 -->
            <div id="standard-display" class="standard-display">
                <p><strong>你的达标标准：</strong></p>
                <p id="standard-text">正在加载你的数据...</p>
            </div>
            
            <button class="btn btn-success" onclick="startGame()">
                🚀 开始闯关！
            </button>
        </div>
        
        <!-- 游戏主界面 -->
        <div id="game-area">
            <div class="game-status">
                <div class="status-box">
                    <div>当前关卡</div>
                    <div class="status-value" id="current-level">1</div>
                </div>
                <div class="status-box">
                    <div>小勇士</div>
                    <div class="status-value" id="player-name">-</div>
                </div>
                <div class="status-box">
                    <div>累计星星</div>
                    <div class="status-value" id="total-stars">0</div>
                </div>
            </div>
            
            <div class="monster-area">
                <div class="monster-name" id="monster-name">森林小怪·跳绳兽</div>
                <div class="monster-desc" id="monster-desc" style="font-size: 1.4em; margin-bottom: 20px; color: #555;">
                    第一关：用你的跳绳数据击败它！每达标一项获得一颗星。
                </div>
                <div class="monster-img" id="monster-img">👾</div>
                
                <div class="data-display">
                    <p style="font-size: 1.3em; margin-bottom: 15px;"><strong>📊 你的体能数据</strong></p>
                    <p>姓名：<span id="disp-name" style="font-weight: bold;">-</span> 
                       <span id="gender-display" style="padding: 5px 15px; border-radius: 15px; font-weight: bold;"></span>
                    </p>
                    <p style="margin-top: 15px;">
                        跳绳: <span id="disp-rope" style="color: #118ab2; font-weight: bold;">-</span> 个 | 
                        体前屈: <span id="disp-sit" style="color: #06d6a0; font-weight: bold;">-</span> cm | 
                        50米跑: <span id="disp-run" style="color: #ef476f; font-weight: bold;">-</span> 秒
                    </p>
                </div>
            </div>
            
            <!-- 星星评分 -->
            <div class="stars-container">
                <div class="star" id="star-1">★</div>
                <div class="star" id="star-2">★</div>
                <div class="star" id="star-3">★</div>
                <div class="stars-count" id="stars-count">0/3 颗星</div>
            </div>
            
            <!-- 游戏按钮 -->
            <button class="btn btn-primary" id="btn-attack" onclick="checkLevelPass()">
                ⚔️ 开始闯关！
            </button>
            <button class="btn btn-success" id="btn-next" onclick="nextLevel()" style="display:none;">
                ⏭️ 进入下一关
            </button>
            
            <!-- 结果区域 -->
            <div class="result-area" id="result-area">
                <div class="result-title" id="result-title">闯关结果</div>
                <div class="result-msg" id="result-msg"></div>
                <div id="result-details" style="margin-top: 20px;"></div>
            </div>
        </div>
        
        <!-- 兑奖券 -->
        <div id="coupon-area" class="coupon-area">
            <div class="coupon-title">🏅 体能小勇士兑奖券 🏅</div>
            <p style="font-size: 1.4em; color: #06d6a0; font-weight: bold; margin: 20px 0;">
                🎉 恭喜你三关全部完美通关！ 🎉
            </p>
            <p style="font-size: 1.2em; margin-bottom: 25px;">
                你已成功击败所有怪兽，集齐9颗星星！<br>
                请凭下方兑奖码到老师处兑换实体奖状！
            </p>
            <div class="coupon-code" id="coupon-code">PHY-2025-8888</div>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; margin: 25px 0;">
                <p><strong>姓名：</strong><span id="cert-name">-</span></p>
                <p><strong>性别：</strong><span id="cert-gender">-</span></p>
                <p><strong>通关时间：</strong><span id="pass-time">-</span></p>
                <p><strong>获得星星：</strong><span id="cert-stars">9颗星</span></p>
            </div>
            <button class="btn btn-warning" onclick="window.print()">
                🖨️ 打印兑奖券
            </button>
            <button class="btn btn-primary" onclick="restartGame()" style="margin-top: 15px;">
                🔄 重新开始
            </button>
        </div>
    </div>

        // 游戏配置 - 一年级体能达标标准
        const STANDARDS = {
            boy: { 
                rope: 109,   // 男生跳绳 ≥ 109个
                sit: 16.1,   // 男生体前屈 ≥ 16.1cm
                run: 10.2    // 男生50米跑 ≤ 10.2秒
            },
            girl: { 
                rope: 110,   // 女生跳绳 ≥ 110个
                sit: 18.6,   // 女生体前屈 ≥ 18.6cm
                run: 11.0    // 女生50米跑 ≤ 11.0秒
            }
        };
        
        const LEVELS = [
            { 
                name: "森林小怪·跳绳兽", 
                desc: "第一关：用你的跳绳数据击败它！每达标一项获得一颗星。",
                emoji: "👾",
                focus: "跳绳"
            },
            { 
                name: "山洞守卫·柔韧怪", 
                desc: "第二关：用你的体前屈数据破解它的防御！每达标一项获得一颗星。",
                emoji: "🛡️",
                focus: "体前屈"
            },
            { 
                name: "终极Boss·闪电兽", 
                desc: "第三关：用你的50米跑速度甩开它！每达标一项获得一颗星。",
                emoji: "⚡",
                focus: "50米跑"
            }
        ];
        
        // 游戏状态
        let studentData = {
            name: "",
            gender: "",
            rope: 0,
            sit: 0,
            run: 0
        };
        
        let currentLevel = 0;
        let levelStars = [0, 0, 0];
        let totalStars = 0;
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            // 姓名输入框事件 - 输入后自动匹配数据
            document.getElementById('student-name').addEventListener('blur', function() {
                const name = this.value.trim();
                if (name && STUDENTS_DATABASE[name]) {
                    loadStudentData(name);
                }
            });
            
            // 为姓名输入框添加回车键支持
            document.getElementById('student-name').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    startGame();
                }
            });
            
            console.log('一年级体能闯关游戏已加载完成，共包含' + Object.keys(STUDENTS_DATABASE).length + '名学生数据');
        });
        
        // 根据姓名加载学生数据
        function loadStudentData(name) {
            const studentInfo = STUDENTS_DATABASE[name];
            if (!studentInfo) return;
            
            // 填充学生数据
            studentData.name = name;
            studentData.gender = studentInfo.gender;
            studentData.rope = studentInfo.rope;
            studentData.sit = studentInfo.sit;
            studentData.run = studentInfo.run;
            
            // 更新标准显示
            updateStandardDisplay();
            
            // 显示提示
            showToast(`✅ 已找到${name}的体能数据！`);
        }
        
        // 更新标准显示
        function updateStandardDisplay() {
            if (!studentData.gender) return;
            
            const standardDisplay = document.getElementById('standard-display');
            const standardText = document.getElementById('standard-text');
            const standard = STANDARDS[studentData.gender];
            const genderText = studentData.gender === 'boy' ? '男生' : '女生';
            
            standardText.innerHTML = `
                <strong>${genderText}达标标准：</strong><br>
                跳绳 ≥ ${standard.rope} 个 (你的成绩：${studentData.rope}个)<br>
                体前屈 ≥ ${standard.sit} cm (你的成绩：${studentData.sit}cm)<br>
                50米跑 ≤ ${standard.run} 秒 (你的成绩：${studentData.run}秒)
            `;
            standardDisplay.style.display = 'block';
        }
        
        // 开始游戏
        function startGame() {
            // 获取学生姓名
            const inputName = document.getElementById('student-name').value.trim();
            
            // 验证姓名
            if (!inputName) {
                showToast('请输入你的姓名');
                document.getElementById('student-name').focus();
                return;
            }
            
            // 检查是否有该学生的数据
            if (!STUDENTS_DATABASE[inputName]) {
                showToast(`❌ 未找到${inputName}的体能数据，请确认姓名是否正确`);
                document.getElementById('student-name').focus();
                return;
            }
            
            // 加载学生数据
            loadStudentData(inputName);
            
            // 初始化游戏状态
            currentLevel = 0;
            levelStars = [0, 0, 0];
            totalStars = 0;
            
            // 平滑切换界面
            document.getElementById('login-form').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('game-area').style.display = 'block';
                document.getElementById('game-area').style.opacity = '0';
                document.getElementById('game-area').style.transition = 'opacity 0.5s';
                document.getElementById('game-area').style.opacity = '1';
                
                // 更新显示
                updateGameDisplay();
                
                // 显示欢迎信息
                const genderText = studentData.gender === 'boy' ? '男生' : '女生';
                showTemporaryMessage(
                    "🎉 欢迎！", 
                    `欢迎${studentData.name}小勇士！<br>你是${genderText}，开始你的闯关之旅吧！`, 
                    "result-good"
                );
            }, 300);
        }
        
        // 更新游戏显示
        function updateGameDisplay() {
            // 更新基本信息
            document.getElementById('player-name').textContent = studentData.name;
            document.getElementById('disp-name').textContent = studentData.name;
            document.getElementById('disp-rope').textContent = studentData.rope;
            document.getElementById('disp-sit').textContent = studentData.sit;
            document.getElementById('disp-run').textContent = studentData.run;
            document.getElementById('total-stars').textContent = totalStars;
            
            // 更新性别显示
            const genderText = studentData.gender === 'boy' ? '男生' : '女生';
            const genderColor = studentData.gender === 'boy' ? '#1565c0' : '#c2185b';
            const genderBg = studentData.gender === 'boy' ? '#bbdefb' : '#f8bbd0';
            
            const genderDisplay = document.getElementById('gender-display');
            genderDisplay.textContent = genderText;
            genderDisplay.style.color = genderColor;
            genderDisplay.style.backgroundColor = genderBg;
            genderDisplay.style.border = `2px solid ${genderColor}`;
            
            // 更新关卡信息
            document.getElementById('current-level').textContent = currentLevel + 1;
            document.getElementById('monster-name').textContent = LEVELS[currentLevel].name;
            document.getElementById('monster-desc').textContent = LEVELS[currentLevel].desc;
            document.getElementById('monster-img').textContent = LEVELS[currentLevel].emoji;
            
            // 重置怪物动画类
            document.getElementById('monster-img').classList.remove('celebrate', 'bounce');
            
            // 更新星星显示
            updateStarsDisplay();
        }
        
        // 更新星星显示
        function updateStarsDisplay() {
            const currentLevelStars = levelStars[currentLevel] || 0;
            
            // 更新星星图标
            for (let i = 1; i <= 3; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i <= currentLevelStars) {
                    star.className = 'star active';
                } else {
                    star.className = 'star';
                }
            }
            
            // 更新星星计数
            document.getElementById('stars-count').textContent = `${currentLevelStars}/3 颗星`;
        }
        
        // 检查关卡是否通过
        function checkLevelPass() {
            const standard = STANDARDS[studentData.gender];
            
            // 检查每项是否达标
            const isRopePass = studentData.rope >= standard.rope;
            const isSitPass = studentData.sit >= standard.sit;
            const isRunPass = studentData.run <= standard.run;
            
            // 计算星星数
            let starCount = 0;
            if (isRopePass) starCount++;
            if (isSitPass) starCount++;
            if (isRunPass) starCount++;
            
            // 更新当前关卡的星星数
            levelStars[currentLevel] = starCount;
            
            // 更新总星星数
            totalStars = levelStars.reduce((a, b) => a + b, 0);
            
            // 显示结果
            showLevelResult(isRopePass, isSitPass, isRunPass, starCount);
            
            // 更新显示
            updateStarsDisplay();
            document.getElementById('total-stars').textContent = totalStars;
            
            // 如果是第三关且获得3颗星，检查是否可以获得兑奖码
            if (currentLevel === 2 && starCount === 3) {
                const allPerfect = levelStars.every(stars => stars === 3);
                if (allPerfect) {
                    // 延迟显示兑奖券
                    setTimeout(() => {
                        showCoupon();
                    }, 2500);
                }
            }
        }
        
        // 显示关卡结果
        function showLevelResult(ropePass, sitPass, runPass, starCount) {
            const resultArea = document.getElementById('result-area');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-msg');
            const resultDetails = document.getElementById('result-details');
            const btnAttack = document.getElementById('btn-attack');
            const btnNext = document.getElementById('btn-next');
            
            // 根据星星数设置结果样式
            let resultClass, titleText, msgText;
            
            if (starCount === 3) {
                resultClass = "result-perfect";
                titleText = "🎉 完美通关！获得3颗星！";
                msgText = "太棒了！三项全部达标，完美击败了怪兽！";
            } else if (starCount === 2) {
                resultClass = "result-good";
                titleText = "👍 表现不错！获得2颗星！";
                msgText = "很好！有两项达标，继续努力争取下一关完美通关！";
            } else if (starCount === 1) {
                resultClass = "result-ok";
                titleText = "💪 继续加油！获得1颗星";
                msgText = "有一项达标，继续努力，下一关争取更好成绩！";
            } else {
                resultClass = "result-need-improve";
                titleText = "📝 需要努力！获得0颗星";
                msgText = "这次没有达标项，不要气馁，继续锻炼，下次一定更好！";
            }
            
            // 构建详细信息
            const standard = STANDARDS[studentData.gender];
            let details = `<div style="text-align:left; margin-top:15px;">`;
            details += `<p><strong>你的成绩：</strong></p>`;
            details += `<p>跳绳: ${studentData.rope}个 ${ropePass ? '✅' : '❌'} (标准: ≥${standard.rope}个)</p>`;
            details += `<p>体前屈: ${studentData.sit}cm ${sitPass ? '✅' : '❌'} (标准: ≥${standard.sit}cm)</p>`;
            details += `<p>50米跑: ${studentData.run}秒 ${runPass ? '✅' : '❌'} (标准: ≤${standard.run}秒)</p>`;
            details += `<p style="margin-top:15px; font-weight:bold;">本关获得: ${starCount}颗星 | 累计获得: ${totalStars}颗星</p>`;
            
            // 如果是最后一关，显示额外信息
            if (currentLevel === 2) {
                if (starCount === 3) {
                    const allPerfect = levelStars.every(stars => stars === 3);
                    if (allPerfect) {
                        details += `<p style="color:#06d6a0; font-weight:bold; margin-top:15px;">🎊 恭喜！三关全部完美通关！正在生成兑奖码...</p>`;
                    } else {
                        details += `<p style="color:#ff9e00; margin-top:15px;">还需努力！三关都获得3颗星才能赢得兑奖码。</p>`;
                    }
                }
            }
            
            details += `</div>`;
            
            // 更新结果区域
            resultTitle.innerHTML = titleText;
            resultMsg.innerHTML = msgText;
            resultDetails.innerHTML = details;
            resultArea.className = `result-area ${resultClass}`;
            
            // 平滑显示结果区域
            resultArea.style.display = 'block';
            resultArea.style.opacity = '0';
            resultArea.style.transition = 'opacity 0.5s';
            setTimeout(() => {
                resultArea.style.opacity = '1';
            }, 100);
            
            // 按钮控制
            if (currentLevel < 2) {
                // 如果不是最后一关，显示"下一关"按钮
                btnAttack.style.display = 'none';
                btnNext.style.display = 'block';
                
                // 添加庆祝动画（如果获得3颗星）
                if (starCount === 3) {
                    document.getElementById('monster-img').classList.add('celebrate');
                }
            } else {
                // 最后一关，隐藏闯关按钮
                btnAttack.style.display = 'none';
                
                // 如果获得3颗星，检查是否三关都完美
                if (starCount === 3) {
                    const allPerfect = levelStars.every(stars => stars === 3);
                    if (allPerfect) {
                        // 三关都完美，会显示兑奖券
                        btnNext.style.display = 'none';
                    } else {
                        // 不是三关都完美，显示重新开始按钮
                        btnNext.innerHTML = '🔄 重新开始';
                        btnNext.style.display = 'block';
                        btnNext.setAttribute('onclick', 'restartFromLevel1()');
                    }
                } else {
                    // 没有获得3颗星，显示重新开始按钮
                    btnNext.innerHTML = '🔄 重新开始';
                    btnNext.style.display = 'block';
                    btnNext.setAttribute('onclick', 'restartFromLevel1()');
                }
            }
        }
        
        // 显示临时消息
        function showTemporaryMessage(title, message, className) {
            const resultArea = document.getElementById('result-area');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-msg');
            const resultDetails = document.getElementById('result-details');
            
            resultTitle.innerHTML = title;
            resultMsg.innerHTML = message;
            resultDetails.innerHTML = '';
            resultArea.className = `result-area ${className}`;
            
            // 平滑显示
            resultArea.style.display = 'block';
            resultArea.style.opacity = '0';
            resultArea.style.transition = 'opacity 0.5s';
            setTimeout(() => {
                resultArea.style.opacity = '1';
            }, 100);
            
            // 3秒后隐藏
            setTimeout(() => {
                resultArea.style.opacity = '0';
                setTimeout(() => {
                    resultArea.style.display = 'none';
                }, 500);
            }, 3000);
        }
        
        // 显示提示消息（Toast）
        function showToast(message) {
            // 创建toast元素
            let toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#ef476f';
            toast.style.color = 'white';
            toast.style.padding = '15px 25px';
            toast.style.borderRadius = '10px';
            toast.style.zIndex = '9999';
            toast.style.boxShadow = '0 5px 15px rgba(0,0,0,0.3)';
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            toast.textContent = message;
            
            // 添加到页面
            document.body.appendChild(toast);
            
            // 显示toast
            setTimeout(() => {
                toast.style.opacity = '1';
            }, 10);
            
            // 3秒后移除
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }
        
        // 进入下一关
        function nextLevel() {
            if (currentLevel >= 2) return;
            
            currentLevel++;
            updateGameDisplay();
            
            // 切换按钮
            document.getElementById('btn-attack').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';
            
            // 隐藏结果区域
            const resultArea = document.getElementById('result-area');
            resultArea.style.opacity = '0';
            setTimeout(() => {
                resultArea.style.display = 'none';
            }, 500);
            
            // 添加关卡切换动画
            document.getElementById('monster-img').classList.add('bounce');
        }
        
        // 从第一关重新开始
        function restartFromLevel1() {
            if (confirm('确定要重新开始闯关吗？当前进度将会丢失。')) {
                currentLevel = 0;
                levelStars = [0, 0, 0];
                totalStars = 0;
                
                // 重置显示
                updateGameDisplay();
                
                // 切换按钮
                document.getElementById('btn-attack').style.display = 'block';
                document.getElementById('btn-next').style.display = 'none';
                
                // 隐藏结果区域
                document.getElementById('result-area').style.display = 'none';
                
                // 更新按钮文本
                document.getElementById('btn-next').innerHTML = '⏭️ 进入下一关';
                document.getElementById('btn-next').setAttribute('onclick', 'nextLevel()');
                
                showToast('游戏已重置，重新开始挑战吧！');
            }
        }
        
        // 显示兑奖券
        function showCoupon() {
            // 平滑隐藏游戏区域
            document.getElementById('game-area').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('game-area').style.display = 'none';
                const couponArea = document.getElementById('coupon-area');
                
                // 生成唯一兑奖码
                const timestamp = Date.now().toString().slice(-6);
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                const couponCode = `PHY-${new Date().getFullYear()}-${randomNum}-${timestamp}`;
                
                // 更新兑奖券信息
                const genderText = studentData.gender === 'boy' ? '男生' : '女生';
                document.getElementById('cert-name').textContent = studentData.name;
                document.getElementById('cert-gender').textContent = genderText;
                document.getElementById('coupon-code').textContent = couponCode;
                document.getElementById('pass-time').textContent = new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('cert-stars').textContent = `${totalStars}颗星`;
                
                // 显示兑奖券
                couponArea.style.display = 'block';
                couponArea.style.opacity = '0';
                couponArea.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    couponArea.style.opacity = '1';
                }, 100);
                
                // 添加庆祝动画
                couponArea.classList.add('celebrate');
                setTimeout(() => {
                    couponArea.classList.remove('celebrate');
                }, 1500);
                
                // 滚动到兑奖券位置
                couponArea.scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }
        
        // 重新开始游戏（从登录开始）
        function restartGame() {
            if (confirm('确定要重新开始游戏吗？将返回登录页面。')) {
                // 平滑隐藏兑奖券
                document.getElementById('coupon-area').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('coupon-area').style.display = 'none';
                    document.getElementById('login-form').style.display = 'block';
                    document.getElementById('login-form').style.opacity = '0';
                    document.getElementById('login-form').style.transition = 'opacity 0.5s';
                    setTimeout(() => {
                        document.getElementById('login-form').style.opacity = '1';
                        // 清空姓名输入框
                        document.getElementById('student-name').value = '';
                        // 隐藏标准显示
                        document.getElementById('standard-display').style.display = 'none';
                    }, 100);
                }, 500);
                
                // 重置游戏状态
                studentData = {
                    name: "",
                    gender: "",
                    rope: 0,
                    sit: 0,
                    run: 0
                };
                
                currentLevel = 0;
                levelStars = [0, 0, 0];
                totalStars = 0;
            }
        }
    </script>
</body>
</html>
